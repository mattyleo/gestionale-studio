version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fattura-studio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fattura_studio
      TZ: Europe/Rome
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fattura_studio"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: fattura-studio-postgres
